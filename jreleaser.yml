project:
  name: jenesis
  description: A Java-native build tool.
  copyright: 2024 Rafael Winterhalter
  authors: [Rafael Winterhalter]
  license: Apache-2.0
  links:
    homepage: https://github.com/jenesis/jenesis
  languages:
    java:
      groupId: build.jenesis
      artifactId: jenesis
      version: '25'
      mainClass: build.jenesis.Make

signing:
  active: ALWAYS
  pgp:
    armored: true
    mode: MEMORY

release:
  github:
    owner: jenesis
    name: jenesis
    branch: main
    branchPush: main
    skipRelease: false
    skipTag: false
    tagName: 'v{{projectVersion}}'

files:
  artifacts:
    - path: 'target/stage/maven/output/build/jenesis/build.jenesis/{{projectVersion}}/build.jenesis-{{projectVersion}}.jar'
    - path: 'target/stage/maven/output/build/jenesis/build.jenesis/{{projectVersion}}/build.jenesis-{{projectVersion}}-sources.jar'

distributions:
  jenesis:
    type: JAVA_BINARY
    artifacts:
      - path: 'sdk/jenesis-{{projectVersion}}.zip'
    brew:
      active: ALWAYS
      formulaName: jenesis
      repository:
        owner: jenesis
        name: homebrew-tap
    scoop:
      active: ALWAYS
      packageName: jenesis
      repository:
        owner: jenesis
        name: scoop-bucket
    # SDKMAN is published from release.yml against state.sdkman.io; JReleaser speaks only the retired vendor API.
    # Uncomment both blocks and drop that step once JReleaser supports the new API - see README.md.
    # sdkman:
      # active: ALWAYS
      # candidate: jenesis
      # command: MAJOR
      # releaseNotesUrl: 'https://github.com/jenesis/jenesis/releases/tag/v{{projectVersion}}'
  jpx:
    type: JAVA_BINARY
    java:
      mainClass: build.jenesis.Jpx
    artifacts:
      - path: 'sdk/jpx-{{projectVersion}}.zip'
    brew:
      active: ALWAYS
      formulaName: jpx
      repository:
        owner: jenesis
        name: homebrew-tap
    scoop:
      active: ALWAYS
      packageName: jpx
      repository:
        owner: jenesis
        name: scoop-bucket
    # sdkman:
      # active: ALWAYS
      # candidate: jpx
      # command: MAJOR
      # releaseNotesUrl: 'https://github.com/jenesis/jenesis/releases/tag/v{{projectVersion}}'

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        applyMavenCentralRules: true
        stagingRepositories:
          - target/stage/maven/output

# No announce endpoint exists on state.sdkman.io.
# announce:
  # sdkman:
    # active: ALWAYS
