syntax = "proto3";

package demo;

import "google/protobuf/timestamp.proto";

option java_package = "demo.greeting";
option java_outer_classname = "GreetingProto";

message Greeting {
  string text = 1;
  int32 count = 2;
  google.protobuf.Timestamp sent = 3;
}

service Greeter {
  rpc Greet (Greeting) returns (Greeting);
}
