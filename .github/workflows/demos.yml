          - { name: code-coverage, dir: demo-36-code-coverage, entry: build/jenesis/Make.java, verify: 'find target -path "*reports/jacoco/coverage/Calculator.html" | grep -q .' }
          - { name: test-selection, dir: demo-37-test-selection, entry: build/Demo.java }
          - { name: pitest, dir: demo-38-pitest, entry: build/jenesis/Make.java, verify: 'find target -path "*reports/pitest/mutations.xml" -exec grep -l "calc.Calculator" {} + | grep -q .' }
          - { name: jmh, dir: demo-39-jmh, entry: build/jenesis/Execute.java, verify: 'jar tf "$(find target -path "*/output/artifacts/*.jar" | head -1)" | grep -q "META-INF/BenchmarkList"' }
          - { name: api-compatibility, dir: demo-40-api-compatibility, entry: build/Demo.java, flags: -Djenesis.dependency.pin=versions, verify: 'find target -path "*reports/japicmp/japicmp-report.xml" -exec grep -l "library.Library" {} + | grep -q .' }
          - { name: kotlin, dir: demo-41-kotlin, entry: build/jenesis/Make.java, verify: 'find target -path "*/output/artifacts/*.jar" | grep -q .' }
          - { name: kotlin-documentation, dir: demo-41-kotlin, entry: build/jenesis/Make.java, flags: -Djenesis.project.documentation=true, verify: 'find target -type d -name documentation | grep -q .' }
