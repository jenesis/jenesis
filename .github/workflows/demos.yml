name: Run the demos

# One job's matrix may hold 256 configurations, and the demos alone are past a third of that, so the
# runner is not a third axis here: build.yml calls this workflow once per operating system, and each
# call matrixes the demos over that one runner. A new demo is a line in the list below, as before.

on:
  workflow_call:
    inputs:
      os:
        description: The runner the demos run on.
        required: true
        type: string

# A called workflow does not inherit the caller's environment, so the mirror is routed here as well.
env:
  MAVEN_REPOSITORY_URI: ${{ vars.MAVEN_REPOSITORY_URI || 'https://repo1.maven.org/maven2/' }}

jobs:
  demo:
    name: ${{ matrix.demo.name }}
    strategy:
      fail-fast: false
      matrix:
        demo:
          - { name: java-pom, dir: demo-01-java-pom, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: java-pom-dependencies, dir: demo-01-java-pom, entry: build/jenesis/Make.java dependencies, verify: 'find target -name graph.properties | grep -q .' }
          - { name: java-modular, dir: demo-02-java-modular, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: java-modular-as-modular, dir: demo-02-java-modular, entry: build/jenesis/Make.java, flags: -Djenesis.project.layout=modular, verify: 'find target -name classes.jar | grep -q .' }
          - { name: java-pom-multi, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, verify: 'test "$(find target -name classes.jar | wc -l)" -ge 2' }
          - { name: java-pom-multi-module, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java +greeter, verify: 'find target -path "*module-greeter*" -name classes.jar | grep -q .' }
          - { name: java-pom-multi-test-engine, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, flags: -Djenesis.test.engine=junit-platform, verify: 'find target -type d -path "*test/executed*" | grep -q .' }
          - { name: java-pom-multi-test-filter, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, flags: "-Djenesis.test.filter=.*GreeterTest#prefix_is_a_greeting", verify: 'grep -rqs prefix_is_a_greeting target' }
          - { name: java-pom-multi-test-reporting, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, flags: -Djenesis.test.reporting=true, verify: 'find target -path "*reports/tests*" -name "TEST-*.xml" | grep -q . && find target -path "*reports/tests*" -name "junit-platform-events-*.xml" | grep -q .' }
          - { name: java-modular-multi, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java, verify: 'test "$(find target -name classes.jar | wc -l)" -ge 2' }
          - { name: java-modular-multi-abstract-test-module, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java stage, flags: -Djenesis.stage.tests=true, verify: 'find target -path "*module-greeter-testing*" -name classes.jar | grep -q . && test -f target/stage/maven/output/demo/greeter/demo.greeter/1-SNAPSHOT/demo.greeter-1-SNAPSHOT-tests.jar && ! find target/stage/modular/output target/stage/maven/output -name "*greeter.testing*" | grep -q . && ! grep -q "demo.greeter.testing" target/stage/maven/output/demo/greeter/demo.greeter/1-SNAPSHOT/demo.greeter-1-SNAPSHOT.pom' }
          - { name: java-modular-multi-as-modular, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java, flags: -Djenesis.project.layout=modular, verify: 'test "$(find target -name classes.jar | wc -l)" -ge 2' }
          - { name: java-modular-multi-dependencies-without-tests, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java dependencies, flags: "-Djenesis.tree.format=compact -Djenesis.tree.tests=false", verify: 'java -Djenesis.print.progress=false -Djenesis.tree.format=compact -Djenesis.tree.tests=false build/jenesis/Make.java dependencies > target/tree-without-tests.txt && grep -q "(module-app)" target/tree-without-tests.txt && ! grep -q "(module-greeter-test)" target/tree-without-tests.txt' }
          - { name: java-modular-multi-module, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java +greeter-test, verify: 'find target -path "*greeter*" -name classes.jar | grep -q .' }
          - { name: java-modular-multi-test-filter, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java, flags: "-Djenesis.test.filter=.*GreeterTest#prefix_is_a_greeting", verify: 'grep -rqs prefix_is_a_greeting target' }
          - { name: pin-provided, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java pin, flags: '-Djenesis.test.skip -Djenesis.pin.file=target/first.properties', verify: 'java -Djenesis.test.skip -Djenesis.pin.file=target/second.properties -Djenesis.pin.provided=target/first.properties build/jenesis/Make.java pin && grep -q "^org.junit.jupiter=" target/first.properties && ! grep -q "^org.junit.jupiter=" target/second.properties' }
          - { name: pin-reports, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java pin, flags: '-Djenesis.test.skip -Djenesis.print.pins=true -Djenesis.print.divergence=true -Djenesis.print.aliases=true -Djenesis.print.fetch=true', verify: 'find target -name divergence.properties | grep -q .' }
          - { name: pin-to-file, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java pin, flags: '-Djenesis.test.skip -Djenesis.pin.file=target/pins.properties', verify: 'grep -q "^org.junit.jupiter=" target/pins.properties' }
          - { name: startup, dir: demo-05-startup, entry: build/jenesis/Make.java, flags: -Djenesis.make.daemon=true, verify: 'find target -name classes.jar -print -quit | grep -q . && find .jenesis/classes -name "Project.class" -print -quit | grep -q .' }
          - { name: java-pom-bundle, dir: demo-06-java-pom-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=bundle, verify: 'find target -type d -name bundle | grep -q .' }
          - { name: java-pom-docker, dir: demo-06-java-pom-executable, entry: build/jenesis/Make.java stage, flags: -Djenesis.make.profiles=docker, verify: 'grep -q "^ENTRYPOINT .*@/app/application.args" target/stage/docker/output/*/Dockerfile && grep -q -- "--class-path" target/stage/docker/output/*/application.args && find target -path "*stage/docker/output/*/jars*" -name "*.jar" | grep -q .' }
          - { name: java-pom-executable, dir: demo-06-java-pom-executable, entry: build/Demo.java }
          - { name: java-pom-launcher, dir: demo-06-java-pom-executable, entry: build/DemoLauncher.java }
          - { name: java-pom-launcher-profile, dir: demo-06-java-pom-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=launcher, verify: 'find target -path "*launcher*" -name "*.jar" -path "*output*" | grep -q .' }
          - { name: java-modular-bundle, dir: demo-07-java-modular-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=bundle, verify: 'find target -type d -name bundle | grep -q .' }
          - { name: java-modular-docker, dir: demo-07-java-modular-executable, entry: build/jenesis/Make.java stage, flags: -Djenesis.make.profiles=docker, verify: 'grep -q "^ENTRYPOINT .*@/app/application.args" target/stage/docker/output/*/Dockerfile && grep -q "demo.modular.executable/sample.Sample" target/stage/docker/output/*/application.args && find target -path "*stage/docker/output/*/jars*" -name "*.jar" | grep -q .' }
          - { name: java-modular-executable, dir: demo-07-java-modular-executable, entry: build/Demo.java }
          - { name: java-modular-jmod-jlink, dir: demo-07-java-modular-executable, entry: build/jenesis/Make.java stage, flags: -Djenesis.make.profiles=image, verify: 'find target -name "*.jmod" | grep -q . && find target -path "*bin*" \( -name java -o -name java.exe \) | grep -q .' }
          - { name: java-modular-launcher, dir: demo-07-java-modular-executable, entry: build/DemoLauncher.java }
          - { name: java-modular-launcher-profile, dir: demo-07-java-modular-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=launcher, verify: 'find target -path "*launcher*" -name "*.jar" -path "*output*" | grep -q .' }
          - { name: bundle, dir: demo-08-bundle, entry: build/Demo.java }
          - { name: java-multi-release, dir: demo-09-java-multi-release, entry: build/jenesis/Execute.java }
          - { name: javac-arguments, dir: demo-10-javac-arguments, entry: build/jenesis/Execute.java }
          - { name: annotations, dir: demo-11-annotations, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: error-prone, dir: demo-12-error-prone, entry: build/Demo.java, verify: 'find target -name classes.jar -print -quit | grep -q .' }
          - { name: data-formats, dir: demo-13-data-formats, entry: build/jenesis/Make.java, verify: 'test "$(find target -name classes.jar | wc -l)" -eq 3 && jar tf "$(find target -path "*module-xml*" -name classes.jar | head -1)" | grep -q "demo/order/Order.class" && jar tf "$(find target -path "*module-protobuf*" -name classes.jar | head -1)" | grep -q "demo/greeting/GreeterGrpc.class" && jar tf "$(find target -path "*module-avro*" -name classes.jar | head -1)" | grep -q "demo/user/User.class"' }
          - { name: service-contracts, dir: demo-14-service-contracts, entry: build/jenesis/Make.java, verify: 'jar tf "$(find target -path "*module-soap*" -name classes.jar | head -1)" | grep -q "demo/greeter/GreeterService.class" && jar tf "$(find target -path "*module-rest*" -name classes.jar | head -1)" | grep -q "demo/greeting/DefaultApi.class"' }
          - { name: antlr, dir: demo-15-antlr, entry: build/jenesis/Execute.java, verify: 'jar tf "$(find target -name classes.jar | head -1)" | grep -q "demo/antlr/calc/CalcVisitor.class"' }
          - { name: maven-exclusions, dir: demo-16-maven-exclusions, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q . && ! find target -path "*resolved*" -name "commons-lang3*" | grep -q .' }
          - { name: bom, dir: demo-17-bom, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: module-alias, dir: demo-18-module-alias, entry: 'build/jenesis/Execute.java -name Ada -shout', verify: 'find target -name classes.jar | grep -q .' }
          - { name: module-classifier, dir: demo-19-module-classifier, entry: build/jenesis/Execute.java }
          - { name: module-layout, dir: demo-20-module-layout, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: module-override, dir: demo-21-module-override, entry: build/jenesis/Execute.java, verify: 'find target -name jakarta.servlet.jar | grep -q . && find target -name jakarta.el.jar | grep -q . && find target -name "jakarta.servlet.jsp-*.jar" | grep -q . && ! find target -name "jakarta.servlet-*.jar" | grep -q . && ! find target -name "jakarta.el-*.jar" | grep -q .' }
          - { name: module-layers, dir: demo-22-module-layers, entry: build/Demo.java, verify: 'find target -name bundle.zip | grep -q . && unzip -p "$(find target -path "*module-app*" -name bundle.zip | head -1)" application.unix.args | grep -q -- "-Djlayer.modulepath."' }
          - { name: module-layer-legacy, dir: demo-23-module-layer-legacy, entry: build/Demo.java, verify: 'unzip -p "$(find target -path "*module-app*" -name bundle.zip | head -1)" application.unix.args | grep -q -- "-Djlayer.classpath."' }
          - { name: platform-guard, dir: demo-24-platform-guard, entry: build/jenesis/Execute.java }
          - { name: platform-guard-legacy, dir: demo-24-platform-guard, entry: build/jenesis/Execute.java, flags: -Djenesis.platform.legacy=true }
          - { name: platform-guard-pom, dir: demo-25-platform-guard-pom, entry: build/jenesis/Execute.java }
          - { name: platform-guard-pom-legacy, dir: demo-25-platform-guard-pom, entry: build/jenesis/Execute.java, flags: -Djenesis.platform.legacy=true }
          - { name: pinning, dir: demo-26-pinning, entry: build/Demo.java }
          - { name: openpgp, dir: demo-27-openpgp, entry: build/Demo.java }
          - { name: sigstore, dir: demo-28-sigstore, entry: build/Demo.java }
          - { name: sbom, dir: demo-29-sbom, entry: build/jenesis/Make.java, verify: 'find target -name "*.cdx.json" | grep -q .' }
          - { name: compliance, dir: demo-30-compliance, entry: build/Demo.java }
          - { name: vulnerabilities, dir: demo-31-vulnerabilities, entry: build/Demo.java }
          - { name: java-quality, dir: demo-32-java-quality, entry: build/jenesis/Make.java, verify: 'find target -type d -name checkstyle | grep -q . && find target -type d -name pmd | grep -q . && find target -type d -name spotbugs | grep -q .' }
          - { name: code-coverage, dir: demo-33-code-coverage, entry: build/jenesis/Make.java, verify: 'find target -path "*reports/jacoco/coverage/Calculator.html" | grep -q .' }
          - { name: test-selection, dir: demo-34-test-selection, entry: build/Demo.java }
          - { name: pitest, dir: demo-35-pitest, entry: build/jenesis/Make.java, verify: 'find target -path "*reports/pitest/mutations.xml" -exec grep -l "calc.Calculator" {} + | grep -q .' }
          - { name: jmh, dir: demo-36-jmh, entry: build/jenesis/Execute.java, verify: 'jar tf "$(find target -name classes.jar | head -1)" | grep -q "META-INF/BenchmarkList"' }
          - { name: api-compatibility, dir: demo-37-api-compatibility, entry: build/Demo.java, flags: -Djenesis.dependency.pin=versions, verify: 'find target -path "*reports/japicmp/japicmp-report.xml" -exec grep -l "library.Library" {} + | grep -q .' }
          - { name: kotlin, dir: demo-38-kotlin, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: kotlin-documentation, dir: demo-38-kotlin, entry: build/jenesis/Make.java, flags: -Djenesis.project.documentation=true, verify: 'find target -type d -name documentation | grep -q .' }
          - { name: kotlin-quality, dir: demo-39-kotlin-quality, entry: build/jenesis/Make.java, verify: 'find target -type d -name detekt | grep -q . && find target -type d -name ktlint | grep -q .' }
          - { name: kotlin-plugin, dir: demo-40-kotlin-plugin, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: scala, dir: demo-41-scala, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: scala-documentation, dir: demo-41-scala, entry: build/jenesis/Make.java, flags: -Djenesis.project.documentation=true, verify: 'find target -type d -name documentation | grep -q .' }
          - { name: scala-quality, dir: demo-42-scala-quality, entry: build/jenesis/Make.java, verify: 'find target -type d -name scalastyle | grep -q .' }
          - { name: groovy, dir: demo-43-groovy, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: groovy-documentation, dir: demo-43-groovy, entry: build/jenesis/Make.java, flags: -Djenesis.project.documentation=true, verify: 'find target -type d -name documentation | grep -q .' }
          - { name: groovy-quality, dir: demo-44-groovy-quality, entry: build/jenesis/Make.java, verify: 'find target -type d -name codenarc | grep -q .' }
          - { name: profiles, dir: demo-45-profiles, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=release, verify: 'find target -type d -path "*assemble/sources*" | grep -q .' }
          - { name: build-cache, dir: demo-46-build-cache, entry: build/jenesis/Make.java, flags: -Djenesis.project.cache, verify: 'find target -name classes.jar -print -quit | grep -q . && find .jenesis/cache -type d -print -quit | grep -q .' }
          - { name: docker-isolation, dir: demo-47-docker-isolation, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: agents, dir: demo-48-agents, entry: build/Demo.java, verify: 'find target -name classes.jar | grep -q . && unzip -p "$(find target -name bundle.zip | head -1)" application.unix.args | grep -q -- "-javaagent:jars/"' }
          - { name: custom-assembler, dir: demo-49-custom-assembler, entry: build/Demo.java }
          - { name: custom-jmod, dir: demo-50-custom-jmod, entry: build/Demo.java }
          - { name: internal-module, dir: demo-51-internal-module, entry: build/Demo.java }
          - { name: external-module, dir: demo-52-external-module, entry: build/Demo.java }
          - { name: custom-maven, dir: demo-53-custom-maven, entry: build/Demo.java }
          - { name: custom-modular, dir: demo-54-custom-modular, entry: build/Demo.java }
          - { name: custom-build, dir: demo-55-custom-build, entry: build/Demo.java }
          - { name: code-signing, dir: demo-56-code-signing, entry: build/Demo.java, verify: 'jar tf "$(find target/stage -name "*.jar" | head -1)" | grep -q "META-INF/DEMO.SF"' }
          - { name: publishing, dir: demo-57-publishing, entry: build/Demo.java }
          - { name: reproducible, dir: demo-58-reproducible, entry: build/Demo.java }
          - { name: jpx, dir: demo-60-jpx, entry: build/Demo.java, verify: 'test "$(find target/jpx -name jpx.properties | wc -l)" -eq 2' }
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Demo ${{ matrix.demo.name }}
        shell: bash
        working-directory: demo/${{ matrix.demo.dir }}
        run: java -Djenesis.dependency.pin=strict ${{ matrix.demo.flags }} ${{ matrix.demo.entry }}

      - name: Verify ${{ matrix.demo.name }}
        if: matrix.demo.verify
        shell: bash
        working-directory: demo/${{ matrix.demo.dir }}
        run: ${{ matrix.demo.verify }}

      - name: Upload target on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-demo-${{ inputs.os }}-${{ matrix.demo.name }}
          path: demo/${{ matrix.demo.dir }}/target/
          retention-days: 3
          if-no-files-found: ignore
