          - { name: project-plugins-outside, dir: demo-58-project-plugins, entry: build/jenesis/Make.java, verify: 'printf "notice.@legal=../..\n" > jenesis.plugins.arguments-outside.properties && ! java -Djenesis.make.profiles=outside build/jenesis/Make.java stage > target/outside.txt 2>&1 && grep -q "lies outside the project" target/outside.txt' }
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK ${{ matrix.demo.jdk }}
        id: toolchain
        if: matrix.demo.jdk
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.demo.jdk }}

      # The hosted tool cache on Linux leaves a JDK writable by every user, which Jenesis refuses to run.
      - name: Restrict JDK ${{ matrix.demo.jdk }} to its owner
        if: matrix.demo.jdk && runner.os == 'Linux'
        shell: bash
        run: sudo chmod -R go-w "${{ steps.toolchain.outputs.path }}"

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Demo ${{ matrix.demo.name }}
        shell: bash
        working-directory: demo/${{ matrix.demo.dir }}
        env:
          TOOLCHAIN_HOME: ${{ steps.toolchain.outputs.path }}
        run: java -Djenesis.dependency.pin=strict ${{ matrix.demo.flags }} ${{ matrix.demo.entry }}

      - name: Verify ${{ matrix.demo.name }}
        if: matrix.demo.verify
        shell: bash
        working-directory: demo/${{ matrix.demo.dir }}
        env:
          TOOLCHAIN_HOME: ${{ steps.toolchain.outputs.path }}
        run: ${{ matrix.demo.verify }}

      - name: Upload target on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-demo-${{ inputs.os }}-${{ matrix.demo.name }}
          path: demo/${{ matrix.demo.dir }}/target/
          retention-days: 3
          if-no-files-found: ignore
