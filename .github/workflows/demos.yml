name: Run the demos

# One job's matrix may hold 256 configurations, and the demos alone are past a third of that, so the
# runner is not a third axis here: build.yml calls this workflow once per operating system, and each
# call matrixes the demos over that one runner. A new demo is a line in the list below, as before.

on:
  workflow_call:
    inputs:
      os:
        description: The runner the demos run on.
        required: true
        type: string

# A called workflow does not inherit the caller's environment, so the mirror is routed here as well.
env:
  MAVEN_REPOSITORY_URI: ${{ vars.MAVEN_REPOSITORY_URI || 'https://repo1.maven.org/maven2/' }}

jobs:
  demo:
    name: ${{ matrix.demo.name }}
    strategy:
      fail-fast: false
      matrix:
        demo:
          - { name: java-pom, dir: demo-01-java-pom, entry: build/jenesis/Make.java, verify: 'find target -path "*/output/artifacts/*.jar" | grep -q .' }
          - { name: java-pom-dependencies, dir: demo-01-java-pom, entry: build/jenesis/Make.java dependencies, verify: 'find target -name graph.properties | grep -q .' }
          - { name: java-modular, dir: demo-02-java-modular, entry: build/jenesis/Make.java, verify: 'find target -path "*/output/artifacts/*.jar" | grep -q .' }
          - { name: java-modular-as-modular, dir: demo-02-java-modular, entry: build/jenesis/Make.java, flags: -Djenesis.project.layout=modular, verify: 'find target -path "*/output/artifacts/*.jar" | grep -q .' }
          - { name: java-pom-multi, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, verify: 'test "$(find target -path "*/output/artifacts/*.jar" | wc -l)" -ge 2' }
          - { name: java-pom-model-4-1-0, dir: demo-05-java-pom-model-4-1-0, entry: build/jenesis/Make.java, verify: 'test "$(find target -path "*/output/artifacts/*.jar" | wc -l)" -ge 2 && grep -q "<version>1.0.0</version>" "$(find target -path "*module-app*describe/pom/output/pom.xml" | head -1)"' }
          - { name: java-preview, dir: demo-15-java-preview, entry: build/jenesis/Make.java stage, verify: 'java -Djenesis.print.progress=false build/jenesis/Execute.java 4294967296 | tr -d "\r" | grep -qx "4294967296 needs a long (4294967296)" && "$(find target/stage/runtime/output -path "*bin*" \( -name java -o -name java.exe \) | head -1)" -m demo.preview/sample.Sample | tr -d "\r" | grep -qx "42 fits an int (42)" && unzip -p "$(find target -path "*module-sources*" -path "*/output/artifacts/*.jar" | head -1)" META-INF/MANIFEST.MF | tr -d "\r" | grep -qx "Jenesis-Preview: 25"' }
          - { name: java-preview-refused, dir: demo-15-java-preview, entry: build/jenesis/Make.java, verify: 'sed -i.bak "s/@jenesis.release 25-preview/@jenesis.release 25/" test/module-info.java && ! java build/jenesis/Make.java > target/refused.txt 2>&1 && grep -q "declare the release as 25-preview" target/refused.txt' }
          - { name: java-pom-multi-module, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java +greeter, verify: 'find target -path "*module-greeter*" -path "*/output/artifacts/*.jar" | grep -q .' }
          - { name: java-pom-multi-test-filter, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, flags: "-Djenesis.test.filter=.*GreeterTest#prefix_is_a_greeting", verify: 'grep -rqs --include=output prefix_is_a_greeting target && ! grep -rqs --include=output prefix_is_not_blank target' }
          - { name: java-pom-multi-test-tag, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, flags: -Djenesis.test.tag=slow, verify: 'grep -rqs --include=output prefix_is_a_greeting target && ! grep -rqs --include=output prefix_is_not_blank target' }
          - { name: java-pom-multi-test-reporting, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, flags: -Djenesis.test.reporting=true, verify: 'find target -path "*reports/tests*" -name "TEST-*.xml" | grep -q . && find target -path "*reports/tests*" -name "junit-platform-events-*.xml" | grep -q .' }
          - { name: java-modular-multi, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java, verify: 'test "$(find target -path "*/output/artifacts/*.jar" | wc -l)" -ge 2' }
          - { name: java-modular-multi-abstract-test-module, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java stage, flags: -Djenesis.stage.tests=true, verify: 'test -f target/stage/maven/output/demo/greeter/demo.greeter/0-SNAPSHOT/demo.greeter-0-SNAPSHOT-tests.jar && test -f target/stage/maven/output/demo/greeter/demo.greeter.testing/0-SNAPSHOT/demo.greeter.testing-0-SNAPSHOT.jar && test -f target/stage/modular/output/demo.greeter.testing/demo.greeter.testing.jar && grep -q "demo.greeter.testing" target/stage/maven/output/demo/greeter/demo.greeter/0-SNAPSHOT/demo.greeter-0-SNAPSHOT.pom' }
          - { name: java-modular-multi-as-modular, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java, flags: -Djenesis.project.layout=modular, verify: 'test "$(find target -path "*/output/artifacts/*.jar" | wc -l)" -ge 2' }
          - { name: java-modular-multi-dependencies-without-tests, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java dependencies, flags: "-Djenesis.tree.format=compact -Djenesis.tree.tests=false", verify: 'java -Djenesis.print.progress=false -Djenesis.tree.format=compact -Djenesis.tree.tests=false build/jenesis/Make.java dependencies > target/tree-without-tests.txt && grep -q "local ./app)" target/tree-without-tests.txt && ! grep -q "local ./greeter-test)" target/tree-without-tests.txt' }
          - { name: java-modular-multi-module, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java +greeter-test, verify: 'find target -path "*greeter*" -path "*/output/artifacts/*.jar" | grep -q .' }
          - { name: java-modular-multi-test-filter, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java, flags: "-Djenesis.test.filter=.*GreeterTest#prefix_is_a_greeting", verify: 'grep -rqs prefix_is_a_greeting target' }
          - { name: ide-modular-multi, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java ide, verify: '! grep -q PROJECT_DIR greeter/demo.greeter.iml && grep -q isTestSource=.false. greeter-testing/demo.greeter.testing.iml && grep -q isTestSource=.true. greeter-test/demo.greeter.test.iml && grep -q target/.idea .idea/misc.xml && ! grep -q name=.test. greeter-testing/.classpath && grep -q name=.test. greeter-test/.classpath && grep -q .eclipse/classes greeter/.classpath && grep -q name=.module. greeter/.classpath && grep -q target/.vscode .vscode/settings.json && grep -q JavaSE-25 greeter/.classpath' }
          - { name: pin-provided, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java pin, flags: '-Djenesis.test.skip -Djenesis.pin.file=target/first.properties', verify: 'java -Djenesis.test.skip -Djenesis.pin.file=target/second.properties -Djenesis.pin.provided=target/first.properties build/jenesis/Make.java pin && grep -q "^org.junit.jupiter=" target/first.properties && ! grep -q "^org.junit.jupiter=" target/second.properties' }
          - { name: pin-reports, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java pin, flags: '-Djenesis.test.skip -Djenesis.print.pins=true -Djenesis.print.divergence=true -Djenesis.print.aliases=true -Djenesis.print.fetch=true', verify: 'find target -name divergence.properties | grep -q .' }
          - { name: pin-to-file, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java pin, flags: '-Djenesis.test.skip -Djenesis.pin.file=target/pins.properties', verify: 'grep -q "^org.junit.jupiter=" target/pins.properties' }
          - { name: startup, dir: demo-06-startup, entry: build/jenesis/Make.java, flags: -Djenesis.make.daemon=true, verify: 'find target -path "*/output/artifacts/*.jar" -print -quit | grep -q . && find .jenesis/classes -name "Project.class" -print -quit | grep -q .' }
          - { name: startup-aot-cache, dir: demo-06-startup, entry: build/jenesis/Make.java, verify: 'java -cp .jenesis/classes build.jenesis.Make -Djenesis.make.aot=true && java -cp .jenesis/classes build.jenesis.Make -Djenesis.make.aot=true && test "$(ls .jenesis/engine-*.aot | wc -l)" -eq 1 && mkdir -p .jenesis/help && java -cp .jenesis/classes build.jenesis.Make -Djenesis.make.aot=true -Djenesis.aot.file=.jenesis/help/engine.aot help && test -z "$(ls -A .jenesis/help)" && ! java -cp .jenesis/classes build.jenesis.Make -Djenesis.make.aot=true -Djenesis.make.daemon=true 2> target/refused.txt && grep -q "jenesis.make.daemon" target/refused.txt' }
          - { name: java-pom-bundle, dir: demo-08-java-pom-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=bundle, verify: 'find target -type d -name bundle | grep -q .' }
          - { name: java-pom-docker, dir: demo-08-java-pom-executable, entry: build/jenesis/Make.java stage, flags: -Djenesis.make.profiles=docker, verify: 'grep -q "^ENTRYPOINT .*@/app/application.args" target/stage/docker/output/*/Dockerfile && grep -q "\"org.opencontainers.image.version\"=\"1.0.0\"" target/stage/docker/output/*/Dockerfile && grep -q "\"org.opencontainers.image.documentation\"=\"https://jenesis.build\"" target/stage/docker/output/*/Dockerfile && grep -q -- "--class-path" target/stage/docker/output/*/application.args && grep -q ":/app/extensions/classpath/\\*\"$" target/stage/docker/output/*/application.args && find target -path "*stage/docker/output/*/jars*" -name "*.jar" | grep -q .' }
          - { name: java-pom-executable, dir: demo-08-java-pom-executable, entry: build/Demo.java }
          - { name: java-pom-launcher, dir: demo-08-java-pom-executable, entry: build/DemoLauncher.java }
          - { name: java-pom-launcher-profile, dir: demo-08-java-pom-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=launcher, verify: 'J="$(find target -path "*bundle/output/launcher/*" -name "*.jar" | head -1)" && unzip -p "$J" META-INF/MANIFEST.MF | grep -q Sbom-Location && unzip -p "$J" "META-INF/sbom/*" | grep -q build.jenesis.launcher' }
          - { name: java-modular-bundle, dir: demo-09-java-modular-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=bundle, verify: 'find target -type d -name bundle | grep -q .' }
          - { name: java-modular-docker, dir: demo-09-java-modular-executable, entry: build/jenesis/Make.java stage, flags: -Djenesis.make.profiles=docker, verify: 'grep -q "^ENTRYPOINT .*@/app/application.args" target/stage/docker/output/*/Dockerfile && grep -q "demo.modular.executable/sample.Sample" target/stage/docker/output/*/application.args && grep -q ":/app/extensions/modulepath\"$" target/stage/docker/output/*/application.args && find target -path "*stage/docker/output/*/jars*" -name "*.jar" | grep -q .' }
          - { name: java-modular-docker-jpackage, dir: demo-09-java-modular-executable, entry: build/jenesis/Make.java, verify: 'if [ "$RUNNER_OS" = Linux ]; then java -Djenesis.make.profiles=container build/jenesis/Make.java stage && grep -q "^ENTRYPOINT \[\"/app/bin/demo.modular.executable\"\]$" target/stage/docker/output/*/Dockerfile && test -x target/stage/docker/output/module-sources/demo.modular.executable/bin/demo.modular.executable && target/stage/docker/output/module-sources/demo.modular.executable/bin/demo.modular.executable Ada | grep -q "Hello, Ada" && test ! -e target/stage/docker/output/module-sources/jars && test ! -e target/stage/packages/output/demo.modular.executable; else ! java -Djenesis.make.profiles=container build/jenesis/Make.java stage > target/refused.txt 2>&1 && grep -q "needs one built for Linux" target/refused.txt; fi' }
          - { name: java-modular-executable, dir: demo-09-java-modular-executable, entry: build/Demo.java, verify: 'find target -path "*runtime*/legal/demo.modular.executable/org.slf4j-*" -name LICENSE.txt | grep -q .' }
          - { name: java-modular-jmod-jlink, dir: demo-09-java-modular-executable, entry: build/jenesis/Make.java stage, flags: -Djenesis.make.profiles=image, verify: 'find target -name "*.jmod" | grep -q . && find target -path "*bin*" \( -name java -o -name java.exe \) | grep -q . && find target/stage/runtime -path "*legal/demo.modular.executable/org.slf4j-*" -name "LICENSE.txt" | grep -q .' }
          - { name: java-modular-launcher, dir: demo-09-java-modular-executable, entry: build/DemoLauncher.java }
          - { name: java-modular-launcher-profile, dir: demo-09-java-modular-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=launcher, verify: 'J="$(find target -path "*bundle/output/launcher/*" -name "*.jar" | head -1)" && unzip -p "$J" META-INF/MANIFEST.MF | grep -q Sbom-Location && unzip -p "$J" "META-INF/sbom/*" | grep -q build.jenesis.launcher' }
          - { name: bundle, dir: demo-10-bundle, entry: build/Demo.java }
          - { name: java-multi-release, dir: demo-11-java-multi-release, entry: build/jenesis/Execute.java }
          - { name: javac-arguments, dir: demo-12-javac-arguments, entry: build/jenesis/Execute.java }
          - { name: annotations, dir: demo-13-annotations, entry: build/jenesis/Make.java, verify: 'find target -path "*/output/artifacts/*.jar" | grep -q .' }
          - { name: error-prone, dir: demo-14-error-prone, entry: build/Demo.java, verify: 'find target -path "*/output/artifacts/*.jar" -print -quit | grep -q .' }
          - { name: data-formats, dir: demo-16-data-formats, entry: build/jenesis/Make.java, verify: 'test "$(find target -path "*/output/artifacts/*.jar" | wc -l)" -eq 3 && jar tf "$(find target -path "*module-xml*" -path "*/output/artifacts/*.jar" | head -1)" | grep -q "demo/order/Order.class" && jar tf "$(find target -path "*module-protobuf*" -path "*/output/artifacts/*.jar" | head -1)" | grep -q "demo/greeting/GreeterGrpc.class" && jar tf "$(find target -path "*module-avro*" -path "*/output/artifacts/*.jar" | head -1)" | grep -q "demo/user/User.class"' }
          - { name: service-contracts, dir: demo-17-service-contracts, entry: build/jenesis/Make.java, verify: 'jar tf "$(find target -path "*module-soap*" -path "*/output/artifacts/*.jar" | head -1)" | grep -q "demo/greeter/GreeterService.class" && jar tf "$(find target -path "*module-rest*" -path "*/output/artifacts/*.jar" | head -1)" | grep -q "demo/greeting/DefaultApi.class"' }
          - { name: antlr, dir: demo-18-antlr, entry: build/jenesis/Execute.java, verify: 'jar tf "$(find target -path "*/output/artifacts/*.jar" | head -1)" | grep -q "demo/antlr/calc/CalcVisitor.class"' }
          - { name: maven-exclusions, dir: demo-19-maven-exclusions, entry: build/jenesis/Make.java, verify: 'find target -path "*/output/artifacts/*.jar" | grep -q . && ! find target -path "*resolved*" -name "commons-lang3*" | grep -q .' }
          - { name: bom, dir: demo-20-bom, entry: build/jenesis/Make.java, verify: 'find target -path "*/output/artifacts/*.jar" | grep -q .' }
          - { name: module-alias, dir: demo-21-module-alias, entry: 'build/jenesis/Execute.java -name Ada -shout', verify: 'find target -path "*/output/artifacts/*.jar" | grep -q . && find target -path "*runtime/legal/demo.cli/org.kohsuke.args4j-*" -name LICENSE | grep -q .' }
          - { name: module-layout, dir: demo-22-module-layout, entry: build/jenesis/Make.java, verify: 'find target -path "*/output/artifacts/*.jar" | grep -q .' }
          - { name: module-override, dir: demo-23-module-override, entry: build/jenesis/Execute.java, verify: 'find target -name jakarta.servlet.jar | grep -q . && find target -name jakarta.el.jar | grep -q . && find target -name "jakarta.servlet.jsp-*.jar" | grep -q . && ! find target -name "jakarta.servlet-*.jar" | grep -q . && ! find target -name "jakarta.el-*.jar" | grep -q .' }
          - { name: module-layers, dir: demo-24-module-layers, entry: build/Demo.java, verify: 'find target -name bundle.zip | grep -q . && unzip -p "$(find target -path "*module-app*" -name bundle.zip | head -1)" application.unix.args | grep -q -- "-Djlayer.modulepath."' }
          - { name: module-layer-legacy, dir: demo-25-module-layer-legacy, entry: build/Demo.java, verify: 'unzip -p "$(find target -path "*module-app*" -name bundle.zip | head -1)" application.unix.args | grep -q -- "-Djlayer.classpath."' }
          - { name: module-layers-execute, dir: demo-24-module-layers, entry: build/jenesis/Make.java, verify: 'java -Djenesis.print.progress=false build/jenesis/Execute.java | tr -d "\r" | grep -q "and one layer deeper: jackson-core 2.13.5"' }
          - { name: module-layers-image, dir: demo-24-module-layers, entry: build/jenesis/Make.java stage, flags: -Djenesis.make.profiles=image, verify: '"$(find target/stage/packages/output \( -name demo.layers.app -o -name demo.layers.app.exe \) -type f | head -1)" | tr -d "\r" | grep -q "and one layer deeper: jackson-core 2.13.5"' }
          - { name: module-layer-legacy-execute, dir: demo-25-module-layer-legacy, entry: build/jenesis/Make.java, verify: 'java -Djenesis.print.progress=false build/jenesis/Execute.java | tr -d "\r" | grep -q "commons-beanutils converted"' }
          - { name: platform-guard, dir: demo-26-platform-guard, entry: build/jenesis/Execute.java }
          - { name: platform-guard-legacy, dir: demo-26-platform-guard, entry: build/jenesis/Execute.java, flags: -Djenesis.platform.legacy=true }
          - { name: platform-guard-pom, dir: demo-27-platform-guard-pom, entry: build/jenesis/Execute.java }
          - { name: platform-guard-pom-legacy, dir: demo-27-platform-guard-pom, entry: build/jenesis/Execute.java, flags: -Djenesis.platform.legacy=true }
          - { name: pinning, dir: demo-28-pinning, entry: build/Demo.java }
          - { name: openpgp, dir: demo-29-openpgp, entry: build/Demo.java }
          - { name: sigstore, dir: demo-30-sigstore, entry: build/Demo.java }
          - { name: sbom, dir: demo-31-sbom, entry: build/jenesis/Make.java, verify: 'find target -name "*.cdx.json" | grep -q . && unzip -l "$(find target -path "*artifacts/jar/output/artifacts/*.jar" | head -1)" | grep -q "META-INF/LICENSE" && unzip -l "$(find target -path "*artifacts/jar/output/artifacts/*.jar" | head -1)" | grep -q "META-INF/maven/build.jenesis.demo/sbom-demo/pom.properties"' }
          - { name: compliance, dir: demo-32-compliance, entry: build/Demo.java }
          - { name: vulnerabilities, dir: demo-33-vulnerabilities, entry: build/Demo.java }
          - { name: java-quality, dir: demo-34-java-quality, entry: build/jenesis/Make.java, verify: 'find target -type d -name checkstyle | grep -q . && find target -type d -name pmd | grep -q . && find target -type d -name spotbugs | grep -q .' }
          - { name: ide-quality-groups, dir: demo-34-java-quality, entry: build/jenesis/Make.java ide/idea, verify: '! grep -q PROJECT_DIR sources/demo.quality.iml && ! grep -q jar:// sources/demo.quality.iml' }
          - { name: test-framework, dir: demo-35-test-framework, entry: build/jenesis/Make.java, verify: 'find target -name "org.junit.jupiter.engine-*.jar" | grep -q . && find target -name "org.junit.vintage.engine-*.jar" | grep -q . && grep -rqs ConsoleLauncher target' }
          - { name: test-framework-declared, dir: demo-35-test-framework, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=explicit, verify: 'find target -type d -path "*test/executed*" | grep -q . && grep -rqs ConsoleLauncher target' }
          - { name: test-framework-category, dir: demo-35-test-framework, entry: build/jenesis/Make.java, flags: '-Djenesis.make.profiles=legacy -Djenesis.test.tag=greetertest.Legacy', verify: 'grep -rqs "IncludeCategories=greetertest.Legacy" target && grep -rqs JUnitCore target' }
