# One-off backfill: publishes the jpx candidate for a version that was already
# released before jreleaser.yml carried a jpx distribution. It downloads that
# version's jar from Maven Central, packages the jpx layout as it stands at the
# release tag, attaches the archive to the existing GitHub release and hands the
# candidate to SDKMAN. Delete this workflow once the backfill has run; every
# later release publishes jpx through jreleaser.yml.

name: Publish jpx to SDKMAN

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to publish as the jpx candidate, X.Y.Z
        required: true
        default: '0.12.0'
        type: string
      publish:
        description: Attach the archive and publish to SDKMAN; unchecked, it is only built and verified
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ inputs.version }}

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Take the released jar from Maven Central
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -fsSL -o "build.jenesis-${VERSION}.jar" \
            "https://repo1.maven.org/maven2/build/jenesis/build.jenesis/${VERSION}/build.jenesis-${VERSION}.jar"
          curl -fsSL -o checksums_sha256.txt \
            "https://github.com/jenesis/jenesis/releases/download/v${VERSION}/checksums_sha256.txt"
          EXPECTED="$(awk -v jar="build.jenesis-${VERSION}.jar" '$2 == jar { print $1 }' checksums_sha256.txt)"
          ACTUAL="$(sha256sum "build.jenesis-${VERSION}.jar" | cut -d' ' -f1)"
          if [ -z "$EXPECTED" ]; then
            echo "The v${VERSION} release lists no checksum for build.jenesis-${VERSION}.jar." >&2
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "The jar on Maven Central is not the one released as v${VERSION}: expected ${EXPECTED}, got ${ACTUAL}." >&2
            exit 1
          fi

      - name: Package the jpx archive
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p sdk/jpx/lib
          cp "build.jenesis-${VERSION}.jar" sdk/jpx/lib/
          cp LICENSE sdk/jpx/LICENSE
          bash sdk/jpx/tests/test.sh
          BASE="jpx-${VERSION}"
          ln -sfn sdk/jpx "${BASE}"
          zip -r "sdk/${BASE}.zip" "${BASE}" -x "${BASE}/tests/*"
          rm "${BASE}"
          sha256sum "sdk/${BASE}.zip" | cut -d' ' -f1 > "sdk/${BASE}.zip.sha256"
          echo "checksum=$(cat "sdk/${BASE}.zip.sha256")" >> "$GITHUB_OUTPUT"

      - name: Launch jpx from the packaged archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          unzip -q "sdk/jpx-${VERSION}.zip" -d unpacked
          "unpacked/jpx-${VERSION}/bin/jpx" --help

      - name: Attach the archive to the release
        if: ${{ inputs.publish }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" \
            "sdk/jpx-${VERSION}.zip" "sdk/jpx-${VERSION}.zip.sha256" --clobber
          curl -fsIL -o /dev/null \
            "https://github.com/jenesis/jenesis/releases/download/v${VERSION}/jpx-${VERSION}.zip"

      - name: Release, default and announce the jpx candidate
        if: ${{ inputs.publish }}
        env:
          VERSION: ${{ inputs.version }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          CONSUMER_KEY: ${{ secrets.SDKMAN_CONSUMER_KEY }}
          CONSUMER_TOKEN: ${{ secrets.SDKMAN_CONSUMER_TOKEN }}
        run: |
          DOWNLOAD="https://github.com/jenesis/jenesis/releases/download/v${VERSION}/jpx-${VERSION}.zip"
          NOTES="https://github.com/jenesis/jenesis/releases/tag/v${VERSION}"
          vendor() {
            curl -sS --fail-with-body -X "$1" "https://vendors.sdkman.io$2" \
              -H "Consumer-Key: ${CONSUMER_KEY}" \
              -H "Consumer-Token: ${CONSUMER_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "$3"
            echo
          }
          vendor POST /release "{\"candidate\":\"jpx\",\"version\":\"${VERSION}\",\"url\":\"${DOWNLOAD}\",\"checksums\":{\"SHA-256\":\"${CHECKSUM}\"}}"
          vendor PUT /default "{\"candidate\":\"jpx\",\"version\":\"${VERSION}\"}"
          vendor POST /announce/struct "{\"candidate\":\"jpx\",\"version\":\"${VERSION}\",\"url\":\"${NOTES}\"}"
