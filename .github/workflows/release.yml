name: Release Jenesis

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to release; defaults to the head this workflow runs on
        required: false
        type: string
      tag:
        description: Tag to cut, vX.Y.Z; defaults to the next minor of the latest tag
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.sha || github.sha }}

      - name: Resolve release version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            VERSION="$(printf '%s' "$TAG" | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
            if [ -z "$VERSION" ]; then
              echo "Tag '$TAG' is not a release tag: pass vX.Y.Z or X.Y.Z, e.g. v1.2.3." >&2
              exit 1
            fi
          else
            LATEST="$(git tag --list --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 | sed 's/^v//')"
            if [ -z "$LATEST" ]; then
              VERSION="0.0.1"
            else
              MAJOR="$(echo "$LATEST" | cut -d. -f1)"
              MINOR="$(echo "$LATEST" | cut -d. -f2)"
              VERSION="${MAJOR}.$((MINOR + 1)).0"
            fi
          fi
          echo "Releasing $VERSION as tag v$VERSION from $(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and stage artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          java -Djenesis.project.version=${VERSION} \
               -Djenesis.project.sources=true \
               -Djenesis.project.documentation=true \
               -Djenesis.dependency.pin=strict \
               -Djenesis.project.metadata=project.properties \
               build/jenesis/Make.java stage

      - name: Package SDKMAN archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clean -fdX sdk/
          mkdir -p sdk/jenesis/lib sdk/jenesis/sources sdk/jpx/lib
          cp "target/stage/maven/output/build/jenesis/build.jenesis/${VERSION}/build.jenesis-${VERSION}.jar" sdk/jenesis/lib/
          cp "target/stage/maven/output/build/jenesis/build.jenesis/${VERSION}/build.jenesis-${VERSION}-sources.jar" sdk/jenesis/sources/
          cp "target/stage/maven/output/build/jenesis/build.jenesis/${VERSION}/build.jenesis-${VERSION}.jar" sdk/jpx/lib/
          cp LICENSE sdk/jenesis/LICENSE
          cp LICENSE sdk/jpx/LICENSE
          for CANDIDATE in jenesis jpx; do
            BASE="${CANDIDATE}-${VERSION}"
            ln -sfn "sdk/${CANDIDATE}" "${BASE}"
            zip -r "sdk/${BASE}.zip" "${BASE}" -x "${BASE}/tests/*"
            rm "${BASE}"
          done

      - name: JReleaser deploy
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          version: latest
          arguments: full-release
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_REPRODUCIBLE: "true"
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_HOMEBREW_GITHUB_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
          JRELEASER_SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}

      - name: Publish the SDKMAN candidates
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EMAIL: ${{ secrets.SDKMAN_EMAIL }}
          PASSWORD: ${{ secrets.SDKMAN_PASSWORD }}
        run: |
          if [ -z "${EMAIL}" ] || [ -z "${PASSWORD}" ]; then
            echo "No SDKMAN credentials: set the SDKMAN_EMAIL and SDKMAN_PASSWORD secrets." >&2
            exit 1
          fi
          TOKEN="$(curl -sS --fail-with-body https://state.sdkman.io/login \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg email "${EMAIL}" --arg password "${PASSWORD}" \
                    '{email: $email, password: $password}')" | jq -r '.token // empty')"
          if [ -z "${TOKEN}" ]; then
            echo "SDKMAN returned no token for ${EMAIL}." >&2
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          for CANDIDATE in jenesis jpx; do
            DOWNLOAD="https://github.com/jenesis/jenesis/releases/download/v${VERSION}/${CANDIDATE}-${VERSION}.zip"
            curl -fsIL -o /dev/null "${DOWNLOAD}"
            curl -sS --fail-with-body -X POST https://state.sdkman.io/versions \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n \
                      --arg candidate "${CANDIDATE}" \
                      --arg version "${VERSION}" \
                      --arg url "${DOWNLOAD}" \
                      --arg sha256sum "$(sha256sum "sdk/${CANDIDATE}-${VERSION}.zip" | cut -d' ' -f1)" \
                      '{candidate: $candidate, version: $version, platform: "UNIVERSAL", visible: true,
                        url: $url, sha256sum: $sha256sum, tags: ["lts", "latest"]}')"
          done

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jreleaser-logs
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
