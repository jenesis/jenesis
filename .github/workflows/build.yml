name: Test Jenesis Tool

on:
  push:
    branches: [main]
  pull_request:

# Route Maven Central through the repository variable MAVEN_REPOSITORY_URI when set
# (the Google Cloud mirror of Central, to avoid Central rate-limiting the runners),
# falling back to Central itself so an unset variable never becomes an empty URI.
env:
  MAVEN_REPOSITORY_URI: ${{ vars.MAVEN_REPOSITORY_URI || 'https://repo1.maven.org/maven2/' }}

jobs:
  demos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        demo:
          - { name: java-pom, dir: demo-01-java-pom, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: java-pom-dependencies, dir: demo-01-java-pom, entry: build/jenesis/Make.java dependencies, verify: 'find target -name graph.properties | grep -q .' }
          - { name: java-modular, dir: demo-02-java-modular, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: java-modular-as-modular, dir: demo-02-java-modular, entry: build/jenesis/Make.java, flags: -Djenesis.project.layout=modular, verify: 'find target -name classes.jar | grep -q .' }
          - { name: java-pom-multi, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, verify: 'test "$(find target -name classes.jar | wc -l)" -ge 2' }
          - { name: java-pom-multi-module, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java +greeter, verify: 'find target -path "*module-greeter*" -name classes.jar | grep -q .' }
          - { name: java-pom-multi-test-engine, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, flags: -Djenesis.test.engine=junit-platform, verify: 'find target -type d -path "*test/executed*" | grep -q .' }
          - { name: java-pom-multi-test-filter, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, flags: "-Djenesis.test.filter=.*GreeterTest#prefix_is_a_greeting", verify: 'grep -rqs prefix_is_a_greeting target' }
          - { name: java-pom-multi-test-reporting, dir: demo-03-java-pom-multi, entry: build/jenesis/Make.java, flags: -Djenesis.test.reporting=true, verify: 'find target -path "*reports/tests*" -name "TEST-*.xml" | grep -q . && find target -path "*reports/tests*" -name "junit-platform-events-*.xml" | grep -q .' }
          - { name: java-modular-multi, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java, verify: 'test "$(find target -name classes.jar | wc -l)" -ge 2' }
          - { name: java-modular-multi-abstract-test-module, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java stage, flags: -Djenesis.stage.tests=true, verify: 'find target -path "*module-greeter-testing*" -name classes.jar | grep -q . && test -f target/stage/maven/output/demo/greeter/demo.greeter/1-SNAPSHOT/demo.greeter-1-SNAPSHOT-tests.jar && ! find target/stage/modular/output target/stage/maven/output -name "*greeter.testing*" | grep -q . && ! grep -q "demo.greeter.testing" target/stage/maven/output/demo/greeter/demo.greeter/1-SNAPSHOT/demo.greeter-1-SNAPSHOT.pom' }
          - { name: java-modular-multi-as-modular, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java, flags: -Djenesis.project.layout=modular, verify: 'test "$(find target -name classes.jar | wc -l)" -ge 2' }
          - { name: java-modular-multi-dependencies-without-tests, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java dependencies, flags: "-Djenesis.tree.format=compact -Djenesis.tree.tests=false", verify: 'java -Djenesis.print.progress=false -Djenesis.tree.format=compact -Djenesis.tree.tests=false build/jenesis/Make.java dependencies > target/tree-without-tests.txt && grep -q "(module-app)" target/tree-without-tests.txt && ! grep -q "(module-greeter-test)" target/tree-without-tests.txt' }
          - { name: java-modular-multi-module, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java +greeter-test, verify: 'find target -path "*greeter*" -name classes.jar | grep -q .' }
          - { name: java-modular-multi-test-filter, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java, flags: "-Djenesis.test.filter=.*GreeterTest#prefix_is_a_greeting", verify: 'grep -rqs prefix_is_a_greeting target' }
          - { name: pin-provided, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java pin, flags: '-Djenesis.test.skip -Djenesis.pin.file=target/first.properties', verify: 'java -Djenesis.test.skip -Djenesis.pin.file=target/second.properties -Djenesis.pin.provided=target/first.properties build/jenesis/Make.java pin && grep -q "^org.junit.jupiter=" target/first.properties && ! grep -q "^org.junit.jupiter=" target/second.properties' }
          - { name: pin-reports, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java pin, flags: '-Djenesis.test.skip -Djenesis.print.pins=true -Djenesis.print.divergence=true -Djenesis.print.aliases=true -Djenesis.print.fetch=true', verify: 'find target -name divergence.properties | grep -q .' }
          - { name: pin-to-file, dir: demo-04-java-modular-multi, entry: build/jenesis/Make.java pin, flags: '-Djenesis.test.skip -Djenesis.pin.file=target/pins.properties', verify: 'grep -q "^org.junit.jupiter=" target/pins.properties' }
          - { name: startup, dir: demo-05-startup, entry: build/jenesis/Make.java, flags: -Djenesis.make.daemon=true, verify: 'find target -name classes.jar -print -quit | grep -q . && find .jenesis/classes -name "Project.class" -print -quit | grep -q .' }
          - { name: java-pom-bundle, dir: demo-06-java-pom-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=bundle, verify: 'find target -type d -name bundle | grep -q .' }
          - { name: java-pom-docker, dir: demo-06-java-pom-executable, entry: build/jenesis/Make.java stage, flags: -Djenesis.make.profiles=docker, verify: 'grep -q "^ENTRYPOINT .*@/app/application.args" target/stage/docker/output/*/Dockerfile && grep -q -- "--class-path" target/stage/docker/output/*/application.args && find target -path "*stage/docker/output/*/jars*" -name "*.jar" | grep -q .' }
          - { name: java-pom-executable, dir: demo-06-java-pom-executable, entry: build/Demo.java }
          - { name: java-pom-launcher, dir: demo-06-java-pom-executable, entry: build/DemoLauncher.java }
          - { name: java-pom-launcher-profile, dir: demo-06-java-pom-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=launcher, verify: 'find target -path "*launcher*" -name "*.jar" -path "*output*" | grep -q .' }
          - { name: java-modular-bundle, dir: demo-07-java-modular-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=bundle, verify: 'find target -type d -name bundle | grep -q .' }
          - { name: java-modular-docker, dir: demo-07-java-modular-executable, entry: build/jenesis/Make.java stage, flags: -Djenesis.make.profiles=docker, verify: 'grep -q "^ENTRYPOINT .*@/app/application.args" target/stage/docker/output/*/Dockerfile && grep -q "demo.modular.executable/sample.Sample" target/stage/docker/output/*/application.args && find target -path "*stage/docker/output/*/jars*" -name "*.jar" | grep -q .' }
          - { name: java-modular-executable, dir: demo-07-java-modular-executable, entry: build/Demo.java }
          - { name: java-modular-jmod-jlink, dir: demo-07-java-modular-executable, entry: build/jenesis/Make.java stage, flags: -Djenesis.make.profiles=image, verify: 'find target -name "*.jmod" | grep -q . && find target -path "*bin*" \( -name java -o -name java.exe \) | grep -q .' }
          - { name: java-modular-launcher, dir: demo-07-java-modular-executable, entry: build/DemoLauncher.java }
          - { name: java-modular-launcher-profile, dir: demo-07-java-modular-executable, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=launcher, verify: 'find target -path "*launcher*" -name "*.jar" -path "*output*" | grep -q .' }
          - { name: bundle, dir: demo-08-bundle, entry: build/Demo.java }
          - { name: java-multi-release, dir: demo-09-java-multi-release, entry: build/jenesis/Execute.java }
          - { name: javac-arguments, dir: demo-10-javac-arguments, entry: build/jenesis/Execute.java }
          - { name: annotations, dir: demo-11-annotations, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: data-formats, dir: demo-12-data-formats, entry: build/jenesis/Make.java, verify: 'test "$(find target -name classes.jar | wc -l)" -eq 3 && jar tf "$(find target -path "*module-xml*" -name classes.jar | head -1)" | grep -q "demo/order/Order.class" && jar tf "$(find target -path "*module-protobuf*" -name classes.jar | head -1)" | grep -q "demo/greeting/GreeterGrpc.class" && jar tf "$(find target -path "*module-avro*" -name classes.jar | head -1)" | grep -q "demo/user/User.class"' }
          - { name: service-contracts, dir: demo-13-service-contracts, entry: build/jenesis/Make.java, verify: 'jar tf "$(find target -path "*module-soap*" -name classes.jar | head -1)" | grep -q "demo/greeter/GreeterService.class" && jar tf "$(find target -path "*module-rest*" -name classes.jar | head -1)" | grep -q "demo/greeting/DefaultApi.class"' }
          - { name: maven-exclusions, dir: demo-14-maven-exclusions, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q . && ! find target -path "*resolved*" -name "commons-lang3*" | grep -q .' }
          - { name: bom, dir: demo-15-bom, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: module-alias, dir: demo-16-module-alias, entry: 'build/jenesis/Execute.java -name Ada -shout', verify: 'find target -name classes.jar | grep -q .' }
          - { name: module-classifier, dir: demo-17-module-classifier, entry: build/jenesis/Execute.java }
          - { name: module-layout, dir: demo-18-module-layout, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: module-override, dir: demo-19-module-override, entry: build/jenesis/Execute.java, verify: 'find target -name jakarta.servlet.jar | grep -q . && find target -name jakarta.el.jar | grep -q . && find target -name "jakarta.servlet.jsp-*.jar" | grep -q . && ! find target -name "jakarta.servlet-*.jar" | grep -q . && ! find target -name "jakarta.el-*.jar" | grep -q .' }
          - { name: module-layers, dir: demo-20-module-layers, entry: build/Demo.java, verify: 'find target -name bundle.zip | grep -q . && unzip -p "$(find target -path "*module-app*" -name bundle.zip | head -1)" application.unix.args | grep -q -- "-Djlayer.modulepath."' }
          - { name: module-layer-legacy, dir: demo-21-module-layer-legacy, entry: build/Demo.java, verify: 'unzip -p "$(find target -path "*module-app*" -name bundle.zip | head -1)" application.unix.args | grep -q -- "-Djlayer.classpath."' }
          - { name: platform-guard, dir: demo-22-platform-guard, entry: build/jenesis/Execute.java }
          - { name: platform-guard-legacy, dir: demo-22-platform-guard, entry: build/jenesis/Execute.java, flags: -Djenesis.platform.legacy=true }
          - { name: platform-guard-pom, dir: demo-23-platform-guard-pom, entry: build/jenesis/Execute.java }
          - { name: platform-guard-pom-legacy, dir: demo-23-platform-guard-pom, entry: build/jenesis/Execute.java, flags: -Djenesis.platform.legacy=true }
          - { name: pinning, dir: demo-24-pinning, entry: build/Demo.java }
          - { name: openpgp, dir: demo-25-openpgp, entry: build/Demo.java }
          - { name: sigstore, dir: demo-26-sigstore, entry: build/Demo.java }
          - { name: sbom, dir: demo-27-sbom, entry: build/jenesis/Make.java, verify: 'find target -name "*.cdx.json" | grep -q .' }
          - { name: compliance, dir: demo-28-compliance, entry: build/Demo.java }
          - { name: vulnerabilities, dir: demo-29-vulnerabilities, entry: build/Demo.java }
          - { name: java-quality, dir: demo-30-java-quality, entry: build/jenesis/Make.java, verify: 'find target -type d -name checkstyle | grep -q . && find target -type d -name pmd | grep -q . && find target -type d -name spotbugs | grep -q .' }
          - { name: code-coverage, dir: demo-31-code-coverage, entry: build/jenesis/Make.java, verify: 'find target -path "*reports/jacoco/coverage/Calculator.html" | grep -q .' }
          - { name: test-selection, dir: demo-32-test-selection, entry: build/Demo.java }
          - { name: pitest, dir: demo-33-pitest, entry: build/jenesis/Make.java, verify: 'find target -path "*reports/pitest/mutations.xml" -exec grep -l "calc.Calculator" {} + | grep -q .' }
          - { name: jmh, dir: demo-34-jmh, entry: build/jenesis/Execute.java, verify: 'jar tf "$(find target -name classes.jar | head -1)" | grep -q "META-INF/BenchmarkList"' }
          - { name: antlr, dir: demo-57-antlr, entry: build/jenesis/Execute.java, verify: 'jar tf "$(find target -name classes.jar | head -1)" | grep -q "demo/antlr/calc/CalcVisitor.class"' }
          - { name: error-prone, dir: demo-58-error-prone, entry: build/Demo.java, verify: 'find target -name classes.jar -print -quit | grep -q .' }
          - { name: code-signing, dir: demo-59-code-signing, entry: build/Demo.java, verify: 'jar tf "$(find target/stage -name "*.jar" | head -1)" | grep -q "META-INF/DEMO.SF"' }
          - { name: api-compatibility, dir: demo-35-api-compatibility, entry: build/Demo.java, flags: -Djenesis.dependency.pin=versions, verify: 'find target -path "*reports/japicmp/japicmp-report.xml" -exec grep -l "library.Library" {} + | grep -q .' }
          - { name: kotlin, dir: demo-36-kotlin, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: kotlin-documentation, dir: demo-36-kotlin, entry: build/jenesis/Make.java, flags: -Djenesis.project.documentation=true, verify: 'find target -type d -name documentation | grep -q .' }
          - { name: kotlin-quality, dir: demo-37-kotlin-quality, entry: build/jenesis/Make.java, verify: 'find target -type d -name detekt | grep -q . && find target -type d -name ktlint | grep -q .' }
          - { name: kotlin-plugin, dir: demo-38-kotlin-plugin, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: scala, dir: demo-39-scala, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: scala-documentation, dir: demo-39-scala, entry: build/jenesis/Make.java, flags: -Djenesis.project.documentation=true, verify: 'find target -type d -name documentation | grep -q .' }
          - { name: scala-quality, dir: demo-40-scala-quality, entry: build/jenesis/Make.java, verify: 'find target -type d -name scalastyle | grep -q .' }
          - { name: groovy, dir: demo-41-groovy, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: groovy-documentation, dir: demo-41-groovy, entry: build/jenesis/Make.java, flags: -Djenesis.project.documentation=true, verify: 'find target -type d -name documentation | grep -q .' }
          - { name: groovy-quality, dir: demo-42-groovy-quality, entry: build/jenesis/Make.java, verify: 'find target -type d -name codenarc | grep -q .' }
          - { name: profiles, dir: demo-43-profiles, entry: build/jenesis/Make.java, flags: -Djenesis.make.profiles=release, verify: 'find target -type d -path "*assemble/sources*" | grep -q .' }
          - { name: build-cache, dir: demo-44-build-cache, entry: build/jenesis/Make.java, flags: -Djenesis.project.cache, verify: 'find target -name classes.jar -print -quit | grep -q . && find .jenesis/cache -type d -print -quit | grep -q .' }
          - { name: docker-isolation, dir: demo-45-docker-isolation, entry: build/jenesis/Make.java, verify: 'find target -name classes.jar | grep -q .' }
          - { name: agents, dir: demo-46-agents, entry: build/Demo.java, verify: 'find target -name classes.jar | grep -q . && unzip -p "$(find target -name bundle.zip | head -1)" application.unix.args | grep -q -- "-javaagent:jars/"' }
          - { name: custom-assembler, dir: demo-47-custom-assembler, entry: build/Demo.java }
          - { name: custom-jmod, dir: demo-48-custom-jmod, entry: build/Demo.java }
          - { name: internal-module, dir: demo-49-internal-module, entry: build/Demo.java }
          - { name: external-module, dir: demo-50-external-module, entry: build/Demo.java }
          - { name: custom-maven, dir: demo-51-custom-maven, entry: build/Demo.java }
          - { name: custom-modular, dir: demo-52-custom-modular, entry: build/Demo.java }
          - { name: custom-build, dir: demo-53-custom-build, entry: build/Demo.java }
          - { name: publishing, dir: demo-54-publishing, entry: build/Demo.java }
          - { name: jpx, dir: demo-56-jpx, entry: build/Demo.java, verify: 'test "$(find target/jpx -name jpx.properties | wc -l)" -eq 2' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Demo ${{ matrix.demo.name }}
        shell: bash
        working-directory: demo/${{ matrix.demo.dir }}
        run: java -Djenesis.dependency.pin=strict ${{ matrix.demo.flags }} ${{ matrix.demo.entry }}

      - name: Verify ${{ matrix.demo.name }}
        if: matrix.demo.verify
        shell: bash
        working-directory: demo/${{ matrix.demo.dir }}
        run: ${{ matrix.demo.verify }}

      - name: Upload target on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-demo-${{ matrix.os }}-${{ matrix.demo.name }}
          path: demo/${{ matrix.demo.dir }}/target/
          retention-days: 3
          if-no-files-found: ignore

  # native-image needs the GraalVM toolchain (the `native-image` tool and its
  # tracing agent), which the plain JDK runners do not carry, so it runs in its
  # own job on a GraalVM distribution rather than in the demo matrix above.
  native-image:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1.6.3
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Native image demo
        shell: bash
        working-directory: demo/demo-55-native-image
        run: java -Djenesis.dependency.pin=strict build/jenesis/Make.java stage

      - name: Verify native image
        shell: bash
        working-directory: demo/demo-55-native-image
        run: |
          image=$(find target -path "*stage/native/output/*" -type f | head -1)
          if [ -z "$image" ]; then
            echo "No native image was produced under target/stage/native/output"
            exit 1
          fi
          echo "Produced native image: $image"
          "$image" | grep -q "from a native binary built by Jenesis"
          "$image" Ada | grep -q "Hello, Ada,"

      - name: Upload target on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-native-image-${{ matrix.os }}
          path: demo/demo-55-native-image/target/
          retention-days: 3
          if-no-files-found: ignore

  project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        layout: [auto, maven, modular, modular_to_maven]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Project layout ${{ matrix.layout }}
        shell: bash
        run: java -Djenesis.dependency.pin=strict -Djenesis.project.layout=${{ matrix.layout }} build/jenesis/Make.java stage

      - name: Upload target on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-project-${{ matrix.os }}-${{ matrix.layout }}
          path: target/
          retention-days: 3
          if-no-files-found: ignore

  # install.sh is the first thing a project runs and nothing else exercises it,
  # so each mode is installed into a throwaway project and the result is built.
  # The script under test is this checkout's; the sources it installs come from
  # the default branch, so a fork's pull request has a ref it can fetch.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Test the installer
        shell: bash
        run: bash installation/install.test.sh

  # installation/worker.js is the Cloudflare Worker serving install.sh at get.jenesis.build.
  # It is JavaScript rather than Java and runs nowhere else, so it gets its own job on one
  # platform. The tests stub the upstream fetch and need no dependencies, so there is no
  # install step and no wrangler.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Test the worker
        working-directory: installation
        run: node --test

  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Stage Jenesis
        shell: bash
        run: |
          java -Djenesis.dependency.pin=strict \
               -Djenesis.project.version=0.0.0-TEST \
               -Djenesis.project.sources=true \
               -Djenesis.test.skip=true \
               -Djenesis.project.metadata=project.properties \
               build/jenesis/Make.java stage

      - name: Populate SDK layout
        shell: bash
        run: |
          mkdir -p sdk/jenesis/lib sdk/jenesis/sources sdk/jpx/lib
          cp target/stage/maven/output/build/jenesis/build.jenesis/0.0.0-TEST/build.jenesis-0.0.0-TEST.jar sdk/jenesis/lib/
          cp target/stage/maven/output/build/jenesis/build.jenesis/0.0.0-TEST/build.jenesis-0.0.0-TEST-sources.jar sdk/jenesis/sources/
          cp target/stage/maven/output/build/jenesis/build.jenesis/0.0.0-TEST/build.jenesis-0.0.0-TEST.jar sdk/jpx/lib/

      - name: Run SDK tests (POSIX)
        if: runner.os != 'Windows'
        run: bash sdk/jenesis/tests/test.sh

      - name: Run SDK tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: sdk\jenesis\tests\test.bat

      - name: Run jpx SDK tests (POSIX)
        if: runner.os != 'Windows'
        run: bash sdk/jpx/tests/test.sh

      - name: Run jpx SDK tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: sdk\jpx\tests\test.bat

      - name: Upload target on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-sdk-${{ matrix.os }}
          path: target/
          retention-days: 3
          if-no-files-found: ignore
